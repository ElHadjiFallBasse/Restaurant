<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connexion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="card" role="region" aria-labelledby="login-title">
        <div class="brand">
          <div class="logo" aria-hidden="true">🔐</div>
          <h1 id="login-title">Se connecter</h1>
          <p class="subtitle">Accédez à votre compte en toute sécurité</p>
        </div>

        <form id="login-form" novalidate>
          <div class="form-field">
            <label for="email">Adresse e-mail</label>
            <input type="email" id="email" name="email" placeholder="vous@exemple.com" autocomplete="username" required />
            <p class="field-error" id="email-error" aria-live="polite"></p>
          </div>

          <div class="form-field">
            <label for="password">Mot de passe</label>
            <div class="password-field">
              <input type="password" id="password" name="password" placeholder="Votre mot de passe" autocomplete="current-password" required minlength="6" />
              <button type="button" class="toggle-visibility" aria-label="Afficher le mot de passe" aria-pressed="false">
                👁️
              </button>
            </div>
            <p class="field-error" id="password-error" aria-live="polite"></p>
          </div>

          <div class="form-row">
            <label class="checkbox">
              <input type="checkbox" id="remember" name="remember" />
              <span>Se souvenir de moi</span>
            </label>
            <a class="link" href="#" id="forgot-password">Mot de passe oublié ?</a>
          </div>

          <button id="submit" class="btn" type="submit">Connexion</button>

          <p class="form-error" id="form-error" aria-live="polite"></p>
        </form>

        <p class="signup">Pas encore de compte ? <a class="link" href="#">Créer un compte</a></p>
      </section>
    </main>

    <script src="./app.js" defer></script>
  </body>
  </html>
